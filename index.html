<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 7 - Unsplash Image Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="top">
        <h1>Lab 7: Asynchronous JavaScript</h1>
        <p class="subtitle">Search Unsplash photos using XHR, Fetch with Promises, or Fetch with Async/Await.</p>

        <!-- Search input (press Enter to search with async/await) -->
        <div class="search">
            <input id="searchInput" type="text" placeholder="Search for images, e.g. mountains" autocomplete="off">
        </div>

        <!-- One button per Ajax technique -->
        <div class="buttons">
            <button id="xhrBtn" type="button">Search using XHR</button>
            <button id="promiseBtn" type="button">Search using Fetch (Promises)</button>
            <button id="asyncBtn" type="button">Search using Fetch (Async/Await)</button>
        </div>

        <p id="message" class="message" role="status"></p>
    </header>

    <!-- Search results are created dynamically with the DOM API -->
    <main id="results" class="results"></main>

    <script src="script.js"></script>
</body>
</html>
